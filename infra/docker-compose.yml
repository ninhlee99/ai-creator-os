# Mac M1 Pro: native services via launchd (primary target).
# Linux/VPS alternative: docker compose up
services:
  orchestrator:
    build: .
    environment:
      - DATABASE_PATH=/data/ledger.db
    volumes:
      - ./data:/data
      - ./.env:/app/.env:ro
    restart: unless-stopped

  api:
    build: .
    command: uvicorn apps.api.main:app --host 0.0.0.0 --port 8080
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./data:/data
      - ./.env:/app/.env:ro
    restart: unless-stopped

  stream-engine:
    build:
      context: ./apps/stream-engine
    network_mode: host
    restart: unless-stopped
