# Linux/VPS alternative. Mac M1 Pro (primary target) uses launchd:
# see infra/mac/launchd/ai.creator-os.aicos.plist
services:
  aicos:
    build: .
    command: ["/app/aicos", "-addr", ":8080", "-data", "/data"]
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./data:/data
    restart: unless-stopped
