{{define "login"}}<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Đăng nhập</title>
<link rel="stylesheet" href="/static/style.css?v={{assetVer}}">
<script>
(function(){try{var t=localStorage.getItem('theme');if(!t&&window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches)t='dark';if(t)document.documentElement.setAttribute('data-theme',t);}catch(e){}})();
</script>
<style>
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:var(--bg)}
.login-card{max-width:380px;width:100%;border-radius:14px;box-shadow:var(--shadow-md)}
.login-brand{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.login-brand svg{width:52px;height:52px;flex:0 0 52px}
.login-brand h1{margin:0;font-size:25px}
.login-card input[type=password]{width:100%;padding:10px 12px;border:1px solid var(--border);background:var(--input-bg);color:var(--text);border-radius:8px;font-size:15px;margin:8px 0 16px;box-sizing:border-box}
.login-err{color:var(--err);font-size:13px;margin-bottom:10px}
</style>
</head>
<body>
<div class="login-wrap">
  <div class="form-card login-card">
    <div class="login-brand">
      <svg viewBox="0 0 160 160" role="img" aria-label="Logo MiuNova">
        <circle cx="80" cy="80" r="75" fill="#e2eaff"/>
        <ellipse cx="80" cy="82" rx="52" ry="22" fill="none" stroke="#7661d8" stroke-width="6"/>
        <ellipse cx="80" cy="82" rx="44" ry="18" fill="none" stroke="#55bfc2" stroke-width="5"/>
        <path d="M43 73 41 54q-1-5 4-3l17 12q8-4 18-4t18 4l17-12q5-2 4 3l-2 19q8 8 8 19 0 17-16 23-13 5-29 2-16 3-29-2Q37 109 37 92q0-11 6-19z" fill="#fff" stroke="#8976de" stroke-width="4"/>
        <circle cx="68" cy="82" r="5" fill="#263451"/><circle cx="91" cy="82" r="5" fill="#263451"/><path d="M77 90q3-4 6 0q-3 4-6 0z" fill="#f4a2be"/><path d="M80 93v3m0 0q-5 5-9 0m9 0q5 5 9 0" fill="none" stroke="#263451" stroke-width="4" stroke-linecap="round"/>
        <circle cx="135" cy="48" r="8" fill="#ffc75e"/>
      </svg>
      <h1>MiuNova</h1>
    </div>
    {{if .Err}}<p class="login-err">{{.Err}}</p>{{end}}
    <form method="post" action="/login">
      <input type="hidden" name="next" value="{{.Next}}">
      <label for="pw">Mật khẩu</label>
      <input type="password" id="pw" name="password" autocomplete="current-password" autofocus>
      <button type="submit" class="btn btn-primary" style="width:100%">Đăng nhập →</button>
    </form>

  </div>
</div>
</body>
</html>{{end}}
