{{define "title"}}Tạo nội dung AI{{end}}
{{define "content"}}
<main class="studio-ai-page" style="max-width:1180px;margin:0 auto;padding:10px 0 32px">
  <header style="display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:22px">
    <div>
      <h1 style="margin:0;font-size:28px;letter-spacing:-.5px">Tạo nội dung</h1>
    </div>
    <a class="btn btn-secondary" href="/studio/jobs?tab=running">Theo dõi tác vụ</a>
  </header>

  {{if .Error}}<p class="err" role="alert">{{.Error}}</p>{{end}}
  {{if .Notice}}<p class="notice" role="status">{{.Notice}}</p>{{end}}

  <section class="card" style="padding:22px;border-radius:16px">
    <form method="post" action="/studio/generate" id="studio-ai-form">
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px">
        <div class="field">
          <label for="provider">Công cụ</label>
          <select id="provider" name="provider" class="form-control">
            <option value="museai">Muse Chat</option>
            <option value="googleflow">Google Flow</option>
          </select>
        </div>
        <div class="field">
          <label for="kind">Nội dung cần tạo</label>
          <select id="kind" name="kind" class="form-control">
            <option value="video">Video</option>
            <option value="script">Kịch bản</option>
            <option value="image">Hình ảnh</option>
          </select>
        </div>
        <div class="field" id="aspect-field">
          <label for="aspect">Tỷ lệ video</label>
          <select id="aspect" name="aspect" class="form-control">
            <option value="VIDEO_ASPECT_RATIO_PORTRAIT">Dọc 9:16 · Reels / Shorts</option>
            <option value="VIDEO_ASPECT_RATIO_LANDSCAPE">Ngang 16:9</option>
            <option value="VIDEO_ASPECT_RATIO_SQUARE">Vuông 1:1</option>
          </select>
        </div>
        <div class="field" id="output-resolution-field">
          <label for="output-resolution">Độ phân giải đầu ra</label>
          <select id="output-resolution" name="output_resolution" class="form-control">
            <option value="4k" selected>4K</option>
            <option value="8k">8K</option>
          </select>
        </div>
        <div class="field">
          <label for="title">Tên tác vụ <span class="hint">(không bắt buộc)</span></label>
          <input id="title" name="title" class="form-control" maxlength="120" placeholder="Ví dụ: Lookbook cardigan mùa thu">
        </div>
      </div>

      <div class="field" style="margin-top:8px">
        <label for="prompt">Mô tả nội dung</label>
        <textarea id="prompt" name="prompt" class="form-control" required maxlength="5000" rows="8" placeholder="Mô tả chủ đề, nhân vật, hành động, bối cảnh, phong cách hình ảnh và thông điệp cần truyền tải…"></textarea>
        <div class="hint" style="display:flex;justify-content:flex-end;gap:10px;margin-top:6px">
          <span id="prompt-count">0 / 5000</span>
        </div>
      </div>

      <label id="flow-credit-consent-wrap" style="display:none;align-items:flex-start;gap:8px;margin:0 0 14px;padding:11px;border:1px solid var(--border);border-radius:9px">
        <input type="checkbox" name="confirm_flow_credits" id="confirm-flow-credits" value="1" style="margin-top:3px">
        <span class="hint">Google Flow có thể dùng credits theo account.</span>
      </label>

      <div style="display:flex;justify-content:flex-end;border-top:1px solid var(--border);padding-top:16px;margin-top:18px">
        <button type="submit" class="btn btn-primary" style="font-weight:700;padding:11px 18px">Tạo nội dung</button>
      </div>
    </form>
  </section>
</main>
<script>
(function(){
  var provider=document.getElementById('provider');
  var kind=document.getElementById('kind');
  var aspect=document.getElementById('aspect-field');
  var resolution=document.getElementById('output-resolution-field');
  var consent=document.getElementById('flow-credit-consent-wrap');
  var consentInput=document.getElementById('confirm-flow-credits');
  var count=document.getElementById('prompt-count');
  var prompt=document.getElementById('prompt');
  function update(){
    var flow=provider.value==='googleflow';
    Array.prototype.forEach.call(kind.options,function(option){option.disabled=flow&&option.value!=='video';});
    if(flow&&kind.value!=='video')kind.value='video';
    aspect.style.display=kind.value==='video'?'':'none';
    resolution.style.display=kind.value==='video'?'':'none';
    consent.style.display=flow&&kind.value==='video'?'flex':'none';
    consentInput.required=flow&&kind.value==='video';
  }
  prompt.addEventListener('input',function(){count.textContent=prompt.value.length+' / 5000';});
  provider.addEventListener('change',update);
  kind.addEventListener('change',update);
  update();
})();
</script>
{{end}}
