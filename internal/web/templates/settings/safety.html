{{define "title"}}Cài đặt · An toàn{{end}}
{{define "content"}}
<h1>Cài đặt · An toàn</h1>
{{template "settings-nav" .}}

<div class="form-card danger-zone">
<h3 style="margin-top:0">Chế độ chạy thử</h3>
<form method="post" action="/settings/dryrun">
  <div class="field">
    <label>Chế độ chạy</label>
    <select name="value">
      <option value="on" {{if .DryRun}}selected{{end}}>Bật chế độ thử (dry-run) — an toàn, không thao tác thật</option>
      <option value="off" {{if not .DryRun}}selected{{end}}>Tắt chế độ thử — chạy thật</option>
    </select>
  </div>
  <button type="submit" class="btn btn-secondary">Lưu</button>
</form>

<h3>Dừng khẩn cấp (Kill switch)</h3>
  <p><span class="badge badge-err">Chặn toàn bộ hoạt động tự động</span></p>
  {{if .Kill}}
  <form method="post" action="/unkill">
    <button type="submit" class="btn btn-secondary">Chạy lại</button>
  </form>
  {{else}}
  <form method="post" action="/kill"
        data-confirm="Dừng khẩn cấp? Mọi hoạt động tự động sẽ dừng ngay lập tức.">
    <button type="submit" class="btn btn-danger">Dừng khẩn cấp</button>
  </form>
  {{end}}
</div>
{{end}}
