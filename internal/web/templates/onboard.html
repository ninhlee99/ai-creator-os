{{define "title"}}Thiết lập lần đầu{{end}}
{{define "content"}}
<h1>Thiết lập</h1>

<div class="form-card" style="max-width:640px">
  <dl class="kv">
    <dt>Phiên bản</dt><dd><code>{{.Version}}</code></dd>
    <dt>Thư mục dữ liệu</dt><dd><code>{{.DataDir}}</code></dd>
  </dl>
  <form method="post" action="/onboard" style="margin-top:16px">
    <label class="check"><input type="checkbox" name="dryrun" value="1" checked id="dryrunBox">
      Chế độ thử — an toàn, không thao tác thật</label>

    <button type="submit" class="btn btn-primary" style="margin-top:12px">Bắt đầu →</button>
    <p class="warn" id="dryrunWarn" style="margin-top:10px">Chế độ thử đang bật · chưa đăng bài hoặc dùng quota thật. <a href="/settings/safety">Cài đặt an toàn</a></p>
  </form>
</div>
<script>
(function(){
  var box = document.getElementById('dryrunBox'), warn = document.getElementById('dryrunWarn');
  function sync(){ warn.style.display = box.checked ? '' : 'none'; }
  box.addEventListener('change', sync); sync();
})();
</script>
{{end}}
