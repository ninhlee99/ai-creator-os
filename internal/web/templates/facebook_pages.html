{{define "title"}}Chọn Facebook Page{{end}}
{{define "content"}}
<main style="max-width:640px;margin:24px auto">
  <section class="card" style="padding:22px;border-radius:16px">
    <p class="hint" style="margin:0 0 6px">KÊNH · {{.Username}}</p>
    <h1 style="margin:0;font-size:24px">Chọn Facebook Page</h1>
    <p class="hint" style="margin:8px 0 18px">MiuNova lưu quyền truy cập cho Page đã chọn. Token không hiển thị trong trang.</p>
    <form method="post" action="/publishers/facebook/select" style="display:grid;gap:10px">
      <input type="hidden" name="state" value="{{.State}}">
      {{range .Pages}}
      <label style="display:flex;align-items:center;gap:11px;padding:13px;border:1px solid var(--border);border-radius:10px;cursor:pointer">
        <input type="radio" name="page_id" value="{{.ID}}" required>
        <span><strong>{{.Name}}</strong><br><small class="hint">Page ID · {{.ID}}</small></span>
      </label>
      {{end}}
      <div style="display:flex;gap:10px;margin-top:8px">
        <button class="btn btn-primary" type="submit">Lưu Page vào kênh</button>
        <a class="btn btn-secondary" href="/publishers">Hủy</a>
      </div>
    </form>
  </section>
</main>
{{end}}
