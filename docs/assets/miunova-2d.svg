<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1160" viewBox="0 0 1800 1160" font-family="Inter,Segoe UI,Arial,sans-serif" role="img" aria-labelledby="title desc">
  <title id="title">MiuNova — sơ đồ hệ thống 2D</title>
  <desc id="desc">Luồng từ người vận hành và dữ liệu, qua bảy vai trò nhân sự, qua cổng xuất bản và Media Delivery Gateway, đến đo lường và học.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8f7ff"/><stop offset="1" stop-color="#edf7fa"/></linearGradient>
    <linearGradient id="manager" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#7155d9"/><stop offset="1" stop-color="#9b6be5"/></linearGradient>
    <linearGradient id="team" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#eef0ff"/><stop offset="1" stop-color="#e7fbfa"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#4c5475" flood-opacity=".12"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10z" fill="#68708d"/></marker>
    <marker id="arrowPurple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10z" fill="#765fe0"/></marker>
    <style>
      .title{font-size:36px;font-weight:750;fill:#202845}.sub{font-size:17px;fill:#58627c}.h{font-size:19px;font-weight:700;fill:#202845}.t{font-size:15px;fill:#505b76}.s{font-size:13px;fill:#64708a}.card{fill:#fff;stroke:#dce1ee;stroke-width:1.4;rx:18;filter:url(#shadow)}.line{stroke:#68708d;stroke-width:2.6;fill:none;marker-end:url(#arrow)}.lead{stroke:#8b76df;stroke-width:2.5;fill:none;marker-end:url(#arrowPurple)}.dash{stroke:#ec8b72;stroke-width:2.4;fill:none;stroke-dasharray:8 7;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1800" height="1160" fill="#f7f8fd"/>
  <text x="56" y="58" class="title">MiuNova · Bản đồ vận hành 2D</text>
  <text x="56" y="88" class="sub">Một job đi qua nhóm nhân sự theo bằng chứng, chốt kiểm soát và vòng học dữ liệu.</text>

  <!-- Inputs -->
  <g class="card">
    <rect x="56" y="135" width="300" height="112" rx="18"/>
    <rect x="390" y="135" width="390" height="112" rx="18"/>
    <rect x="814" y="135" width="390" height="112" rx="18"/>
    <rect x="1238" y="135" width="506" height="112" rx="18"/>
  </g>
  <text x="82" y="172" class="h">Người vận hành</text><text x="82" y="196" class="t">Điện thoại · social OAuth</text><text x="82" y="219" class="s">Web AI login tùy chọn qua remote browser</text>
  <text x="416" y="172" class="h">Tín hiệu &amp; dữ liệu</text><text x="416" y="200" class="t">Kênh · xu hướng · offer · hoa hồng</text><text x="416" y="222" class="s">Sales + review có nguồn; thiếu → watchlist</text>
  <text x="840" y="172" class="h">Nguồn tạo nội dung</text><text x="840" y="196" class="t">Chỉ account miễn phí được phép; quota có giới hạn</text><text x="840" y="219" class="s">Web AI: login một lần nếu instance chọn dùng</text>
  <text x="1264" y="172" class="h">Đầu ra theo quyền nền tảng</text><text x="1264" y="200" class="t">TikTok: kiểm eligibility → consent hoặc handoff</text><text x="1264" y="222" class="s">Threads video: URL media HTTPS tạm theo artifact</text>

  <!-- Control -->
  <rect x="56" y="286" width="1688" height="160" rx="22" fill="#f0edff" stroke="#d6cff8" stroke-width="1.5"/>
  <text x="82" y="319" class="h">Bàn điều hành</text>
  <g class="card">
    <rect x="82" y="336" width="385" height="84" rx="15"/>
    <rect x="500" y="336" width="375" height="84" rx="15"/>
    <rect x="908" y="336" width="375" height="84" rx="15"/>
    <rect x="1316" y="336" width="402" height="84" rx="15"/>
  </g>
  <text x="104" y="369" class="h">01 · Orchestrator · quản đốc</text><text x="104" y="396" class="s">Lập thứ tự · giao việc · retry hữu hạn · đóng job</text>
  <text x="522" y="369" class="h">Scheduler · Job State</text><text x="522" y="396" class="s">Lịch · giới hạn · artifact · event log</text>
  <text x="930" y="369" class="h">Governance · quota guard</text><text x="930" y="396" class="s">Luật code: miễn phí, retry hữu hạn, stop</text>
  <text x="1338" y="369" class="h">Media Delivery Gateway</text><text x="1338" y="396" class="s">Threads: URL HTTPS tạm · một artifact</text>

  <path d="M206 247v29q0 10 10 10h360" class="line"/>
  <path d="M585 247v29" class="line"/>
  <path d="M1009 247v29" class="line"/>
  <path d="M1490 247v29" class="line"/>
  <path d="M467 378h33M875 378h33M1283 378h33" class="line"/>

  <!-- Team lane -->
  <rect x="56" y="474" width="1688" height="300" rx="22" fill="#edf4fb" stroke="#d7e2f0" stroke-width="1.5"/>
  <text x="82" y="510" class="h">Đội nhân sự logic · mỗi vai trò nhận đầu ra trước, bàn giao đầu vào sau</text>
  <text x="82" y="535" class="s">Vai trò mục tiêu; backend có thể ghép nhiều vai trò trong cùng worker. Không hàm ý đã triển khai đầy đủ.</text>
  <g class="card">
    <rect x="78" y="558" width="220" height="184" rx="16"/>
    <rect x="318" y="558" width="220" height="184" rx="16"/>
    <rect x="558" y="558" width="220" height="184" rx="16"/>
    <rect x="798" y="558" width="220" height="184" rx="16"/>
    <rect x="1038" y="558" width="220" height="184" rx="16"/>
    <rect x="1278" y="558" width="220" height="184" rx="16"/>
    <rect x="1518" y="558" width="204" height="184" rx="16"/>
  </g>
  <g text-anchor="middle" font-size="22" font-weight="750" fill="#fff">
    <circle cx="188" cy="610" r="35" fill="#7965db"/><text x="188" y="618" font-size="18">01</text>
    <circle cx="428" cy="610" r="35" fill="#49aeb3"/><text x="428" y="618" font-size="18">02</text>
    <circle cx="668" cy="610" r="35" fill="#8e79d8"/><text x="668" y="618" font-size="18">03</text>
    <circle cx="908" cy="610" r="35" fill="#ce9b4f"/><text x="908" y="618" font-size="18">04</text>
    <circle cx="1148" cy="610" r="35" fill="#d4778b"/><text x="1148" y="618" font-size="18">05</text>
    <circle cx="1388" cy="610" r="35" fill="#4fa78f"/><text x="1388" y="618" font-size="18">06</text>
    <circle cx="1620" cy="610" r="35" fill="#5b85bd"/><text x="1620" y="618" font-size="18">07</text>
  </g>
  <g text-anchor="middle">
    <text x="188" y="673" class="h">Điều phối</text><text x="188" y="700" class="s">DAG · trạng thái · retry</text><text x="188" y="720" class="s">Đóng job có lý do</text>
    <text x="428" y="673" class="h">Hunter · trinh sát</text><text x="428" y="700" class="s">Trend · offer · hoa hồng</text><text x="428" y="720" class="s">Đủ sales + review mới sản xuất</text>
    <text x="668" y="673" class="h">Chiến lược nội dung</text><text x="668" y="700" class="s">Organic / affiliate</text><text x="668" y="720" class="s">Hook · script · biến thể</text>
    <text x="908" y="673" class="h">Sản xuất</text><text x="908" y="700" class="s">Ảnh · video · âm thanh</text><text x="908" y="720" class="s">Dùng nguồn miễn phí</text>
    <text x="1148" y="673" class="h">Kiểm định</text><text x="1148" y="700" class="s">Claim · quyền · disclosure</text><text x="1148" y="720" class="s">Đạt mới bàn giao</text>
    <text x="1388" y="673" class="h">Xuất bản</text><text x="1388" y="700" class="s">Adapter theo quyền API</text><text x="1388" y="720" class="s">TikTok gate → consent/handoff</text>
    <text x="1620" y="673" class="h">Phân tích</text><text x="1620" y="700" class="s">View · click · đơn</text><text x="1620" y="720" class="s">Cập nhật bài học</text>
  </g>
  <path d="M298 650h20M538 650h20M778 650h20M1018 650h20M1258 650h20M1498 650h20" class="line"/>
  <path d="M1618 558V456H274V446" class="lead"/>

  <!-- Output gates -->
  <g class="card">
    <rect x="56" y="822" width="506" height="124" rx="18"/>
    <rect x="590" y="822" width="528" height="124" rx="18"/>
    <rect x="1146" y="822" width="598" height="124" rx="18"/>
  </g>
  <text x="82" y="860" class="h">Chốt tài nguyên · điều khiển bằng code</text><text x="82" y="888" class="t">Account miễn phí khác còn quota? Thử theo policy.</text><text x="82" y="915" class="s">Hết tất cả nguồn phù hợp → dừng job, lưu lý do, báo người vận hành.</text>
  <text x="616" y="860" class="h">Chốt quyền xuất bản</text><text x="616" y="888" class="t">TikTok eligibility chưa xác nhận: xuất file/handoff.</text><text x="616" y="915" class="s">Có quyền API: lựa chọn + consent theo từng bài; không bypass.</text>
  <text x="1172" y="860" class="h">Vòng phản hồi</text><text x="1172" y="888" class="t">Metrics có nguồn → Analyst → lần lập kế hoạch kế tiếp.</text><text x="1172" y="915" class="s">Thiếu số liệu thì ghi unknown, không suy diễn thành 0.</text>
  <path d="M908 742v60q0 20-20 20H562" class="dash"/>
  <path d="M1388 742v50q0 30-30 30h-240" class="line"/>
  <path d="M1618 742v60q0 20-20 20h-452" class="lead"/>

  <!-- Boundary -->
  <rect x="56" y="982" width="1688" height="150" rx="20" fill="#fff4f0" stroke="#f1c8bc" stroke-width="1.5"/>
  <text x="82" y="1020" class="h">Các điểm dừng an toàn</text>
  <text x="82" y="1050" class="t">Hết nguồn miễn phí · hết retry QC · thiếu bằng chứng/quyền · TikTok chưa xác nhận eligibility → không tự đăng.</text>
  <text x="82" y="1078" class="s">Mô hình mục tiêu; vai trò có thể ghép trong ít worker. Code hiện tại chưa đạt toàn bộ luồng này.</text>
  <text x="82" y="1110" class="s">Threads video: Meta cần tải media từ URL công khai tạm; dashboard và thư mục /media không được mở công khai.</text>
</svg>
