<svg xmlns="http://www.w3.org/2000/svg" width="2420" height="1540" viewBox="0 0 2420 1540" font-family="Inter,Segoe UI,Arial,sans-serif" role="img" aria-labelledby="title desc">
  <title id="title">MiuNova — mô hình xưởng sáng tạo 3D có chú giải nhân viên</title>
  <desc id="desc">Hình 3D xưởng MiuNova, đánh số bảy vai trò agent, luồng bàn giao, cổng quota miễn phí, quyền TikTok và thao tác từ điện thoại.</desc>
  <defs>
    <linearGradient id="page" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#111a3d"/><stop offset="1" stop-color="#26365f"/></linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#f0f4ff"/></linearGradient>
    <filter id="shadow" x="-15%" y="-20%" width="130%" height="145%"><feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#070c22" flood-opacity=".28"/></filter>
    <style>
      .title{font-size:44px;font-weight:800;fill:#fff}.sub{font-size:21px;fill:#d4ddf5}.role{font-size:23px;font-weight:750;fill:#202845}.task{font-size:18px;fill:#55617e}.small{font-size:18px;fill:#dbe3fb}.panelTitle{font-size:25px;font-weight:750;fill:#202845}.body{font-size:20px;fill:#4d5b7a}.chip{font-size:25px;font-weight:800;fill:#fff}.card{fill:#fff;stroke:#d9e0f1;stroke-width:1.4;rx:18;filter:url(#shadow)}.marker{stroke:#fff;stroke-width:4;filter:url(#shadow)}
    </style>
  </defs>
  <rect width="2420" height="1540" fill="#172144"/>
  <text x="48" y="65" class="title">MiuNova · Xưởng sáng tạo 3D</text>
  <text x="50" y="101" class="sub">Mỗi số chỉ một nhân viên. Hình mô phỏng nhiệm vụ, bàn giao và các điểm cần quyền hoặc xác nhận.</text>

  <rect x="38" y="128" width="1600" height="900" rx="26" fill="#fff" stroke="#d9e2f4" stroke-width="2" filter="url(#shadow)"/>
  <image href="miunova-3d-office.png" x="48" y="138" width="1580" height="889" preserveAspectRatio="xMidYMid meet"/>

  <!-- Number badges map scene stations to the employee roster. -->
  <g text-anchor="middle" dominant-baseline="central">
    <circle cx="850" cy="510" r="35" fill="#7965db" class="marker"/><text x="850" y="510" class="chip">01</text>
    <circle cx="424" cy="322" r="35" fill="#49aeb3" class="marker"/><text x="424" y="322" class="chip">02</text>
    <circle cx="717" cy="314" r="35" fill="#8e79d8" class="marker"/><text x="717" y="314" class="chip">03</text>
    <circle cx="1059" cy="353" r="35" fill="#ce9b4f" class="marker"/><text x="1059" y="353" class="chip">04</text>
    <circle cx="1378" cy="395" r="35" fill="#d4778b" class="marker"/><text x="1378" y="395" class="chip">05</text>
    <circle cx="1268" cy="657" r="35" fill="#4fa78f" class="marker"/><text x="1268" y="657" class="chip">06</text>
    <circle cx="382" cy="600" r="35" fill="#5b85bd" class="marker"/><text x="382" y="600" class="chip">07</text>
  </g>

  <!-- Employee roster -->
  <g>
    <rect x="1660" y="128" width="722" height="132" class="card"/>
    <circle cx="1708" cy="194" r="29" fill="#7965db"/><text x="1708" y="202" class="chip" text-anchor="middle" font-size="19">01</text>
    <text x="1752" y="183" class="role">Quản đốc · Orchestrator</text><text x="1752" y="216" class="task">Nhận mục tiêu · chia job · theo dõi retry và bàn giao</text>

    <rect x="1660" y="270" width="722" height="132" class="card"/>
    <circle cx="1708" cy="336" r="29" fill="#49aeb3"/><text x="1708" y="344" class="chip" text-anchor="middle" font-size="19">02</text>
    <text x="1752" y="325" class="role">Hunter · Trinh sát</text><text x="1752" y="358" class="task">Chỉ chọn khi đủ sales + review evidence</text>

    <rect x="1660" y="412" width="722" height="132" class="card"/>
    <circle cx="1708" cy="478" r="29" fill="#8e79d8"/><text x="1708" y="486" class="chip" text-anchor="middle" font-size="19">03</text>
    <text x="1752" y="467" class="role">Đạo diễn nội dung</text><text x="1752" y="500" class="task">Chọn organic/affiliate · viết hook, kịch bản, disclosure</text>

    <rect x="1660" y="554" width="722" height="132" class="card"/>
    <circle cx="1708" cy="620" r="29" fill="#ce9b4f"/><text x="1708" y="628" class="chip" text-anchor="middle" font-size="19">04</text>
    <text x="1752" y="609" class="role">Nhà sản xuất</text><text x="1752" y="642" class="task">Tạo ảnh/video/âm thanh · ghi provider và quota đã dùng</text>

    <rect x="1660" y="696" width="722" height="132" class="card"/>
    <circle cx="1708" cy="762" r="29" fill="#d4778b"/><text x="1708" y="770" class="chip" text-anchor="middle" font-size="19">05</text>
    <text x="1752" y="751" class="role">Kiểm định · Quality Reviewer</text><text x="1752" y="784" class="task">Kiểm claim, quyền, disclosure, sản phẩm và file</text>

    <rect x="1660" y="838" width="722" height="132" class="card"/>
    <circle cx="1708" cy="904" r="29" fill="#4fa78f"/><text x="1708" y="912" class="chip" text-anchor="middle" font-size="19">06</text>
    <text x="1752" y="893" class="role">Nhà xuất bản · Publisher</text><text x="1752" y="926" class="task">Đăng khi có quyền · TikTok: consent hoặc handoff</text>

    <rect x="1660" y="980" width="722" height="132" class="card"/>
    <circle cx="1708" cy="1046" r="29" fill="#5b85bd"/><text x="1708" y="1054" class="chip" text-anchor="middle" font-size="19">07</text>
    <text x="1752" y="1035" class="role">Nhà phân tích · Analyst</text><text x="1752" y="1068" class="task">Đo view/click/đơn/commission · gửi bài học về quản đốc</text>
  </g>

  <!-- Process and hard gates -->
  <g>
    <rect x="38" y="1150" width="748" height="344" class="card"/>
    <text x="72" y="1197" class="panelTitle">Một job đi qua đội</text>
    <text x="72" y="1240" class="body">01 Điều phối → 02 Trinh sát → 03 Đạo diễn</text>
    <text x="72" y="1277" class="body">→ 04 Sản xuất → 05 Kiểm định</text>
    <text x="72" y="1314" class="body">→ 06 Xuất bản/handoff → 07 Phân tích → 01</text>
    <text x="72" y="1374" class="body">Mỗi bàn giao có artifact, trạng thái và nguồn.</text>
    <text x="72" y="1410" class="body">Không dựng hoạt động giả trên dashboard.</text>

    <rect x="812" y="1150" width="748" height="344" class="card"/>
    <text x="846" y="1197" class="panelTitle">Quota và quyền · luật cứng</text>
    <text x="846" y="1240" class="body">Chỉ dùng nguồn miễn phí đã được phép.</text>
    <text x="846" y="1277" class="body">Quota cạn → thử account hợp lệ khác.</text>
    <text x="846" y="1314" class="body">Hết nguồn phù hợp → dừng, lưu lý do, báo bạn.</text>
    <text x="846" y="1374" class="body">Scheduler, quota và permission là code gate,</text>
    <text x="846" y="1410" class="body">không phải AI tự sửa luật hoặc tự chi tiền.</text>

    <rect x="1586" y="1150" width="796" height="344" class="card"/>
    <text x="1620" y="1197" class="panelTitle">Bạn · người vận hành từ điện thoại</text>
    <text x="1620" y="1240" class="body">Kết nối social · theo dõi trạng thái · nhận cảnh báo.</text>
    <text x="1620" y="1277" class="body">TikTok API eligibility chưa xác nhận:</text>
    <text x="1620" y="1314" class="body">mô hình giữ nhánh xuất file/handoff thủ công.</text>
    <text x="1620" y="1374" class="body">Nếu API được cấp: chọn trường cần thiết</text>
    <text x="1620" y="1410" class="body">và xác nhận consent riêng cho từng bài.</text>
  </g>
  <text x="48" y="1525" class="small">Đây là mô hình mục tiêu. Bảy vai trò là nhân viên logic; code hiện tại có thể ghép vai trò trong ít worker. Trạng thái thực xem IMPLEMENTATION_STATUS.</text>
</svg>
